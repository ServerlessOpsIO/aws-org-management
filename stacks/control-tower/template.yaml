AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Organization Control Plane - Control Tower

Parameters:
  LzVersion:
    Type: String
    Description: Control Tower Landing Zone Version
  LzRegions:
    Type: CommaDelimitedList
    Description: List of regions for Control Tower Landing Zone
  SecurityOuId:
    Type: String
    Description: ID of Security OU

Resources:
  AuditAccount:
    Type: AWS::Organizations::Account
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AccountName: Audit
      Email: admin+aws-audit@serverlessopsio.com
      ParentIds:
        - !Ref SecurityOuId

  LandingZone:
    Type: AWS::ControlTower::LandingZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Version: !Ref LzVersion
      Manifest:
        governedRegions: !Ref LzRegions
        accessManagement:
          enabled: false
        backup:
          enabled: false
        centralizedLogging:
          enabled: false
        config:
          enabled: true
          accountId: !Ref AuditAccount
          configurations:
            loggingBucket:
              retentionDays: 365
            accessLoggingBucket:
              retentionDays: 365
        securityRoles:
          enabled: true
          accountId: !Ref AuditAccount