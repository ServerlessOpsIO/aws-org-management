AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Organization Control Plane - Control Tower

Parameters:
  LzVersion:
    Type: String
    Description: Control Tower Landing Zone Version
  LzRegions:
    Type: CommaDelimitedList
    Description: List of regions for Control Tower Landing Zone
  AuditAccountId:
    Type: String
    Description: Audit Account Id

Resources:
  LandingZone:
    Type: AWS::ControlTower::LandingZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Version: !Ref LzVersion
      Manifest:
        governedRegions: !Ref LzRegions
        accessManagement:
          enabled: false
        backup:
          enabled: false
        centralizedLogging:
          enabled: false
        config:
          enabled: true
          accountId: !Ref AuditAccountId
          configurations:
            loggingBucket:
              retentionDays: 365
            accessLoggingBucket:
              retentionDays: 365
        securityRoles:
          enabled: true
          accountId: !Ref AuditAccountId
